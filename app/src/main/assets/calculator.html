<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080a14">
  <meta name="description" content="Presstester — офлайн-калькулятор с секретом 67">
  <title>Presstester</title>
  <link rel="stylesheet" href="calculator.css">
  <script src="calculator.js" defer></script>
</head>
<body>
  <main class="container" id="calculatorView">
    <header class="header">
      <div class="brand-row">
        <div class="brand-icon" aria-hidden="true">P<span>.</span></div>
        <div class="brand-copy"><div class="brand-name">Presstester</div><div class="brand-descriptor">SMART CALCULATOR</div></div>
        <button class="sound-toggle" id="soundToggle" onclick="toggleSound()" aria-label="Отключить звук" title="Звук">♫</button>
      </div>
      <p class="intro">Считай как обычно. Секреты найдут тебя сами.</p>
    </header>

    <section class="calculator" aria-label="Калькулятор">
      <div class="display-caption"><span>STANDARD MODE</span><span class="ready"><i></i> READY</span></div>
      <div class="display-box"><div class="display-deco" aria-hidden="true">=</div><input id="display" type="text" value="0" readonly aria-label="Результат вычислений"></div>
      <div class="buttons">
        <button type="button" class="function" onclick="clearDisplay()">AC</button>
        <button type="button" class="function" onclick="backspace()" aria-label="Удалить символ">⌫</button>
        <button type="button" class="function" onclick="press('%')">%</button>
        <button type="button" class="operator" onclick="press('/')">÷</button>
        <button type="button" onclick="press('7')">7</button>
        <button type="button" onclick="press('8')">8</button>
        <button type="button" onclick="press('9')">9</button>
        <button type="button" class="operator" onclick="press('*')">×</button>
        <button type="button" onclick="press('4')">4</button>
        <button type="button" onclick="press('5')">5</button>
        <button type="button" onclick="press('6')">6</button>
        <button type="button" class="operator" onclick="press('-')">−</button>
        <button type="button" onclick="press('1')">1</button>
        <button type="button" onclick="press('2')">2</button>
        <button type="button" onclick="press('3')">3</button>
        <button type="button" class="operator" onclick="press('+')">+</button>
        <button type="button" class="wide" onclick="press('0')">0</button>
        <button type="button" onclick="press('.')">.</button>
        <button type="button" class="equal" onclick="calculate()">=</button>
      </div>
    </section>
    <footer><span class="foot-mark">PRESSTESTER</span><span>CALCULATE · DISCOVER · REPEAT</span></footer>
  </main>

  <section id="easterEgg" class="easter-egg" hidden role="dialog" aria-modal="true" aria-label="SIX SEVEN">
    <div class="secret-bg" aria-hidden="true"></div>
    <div class="secret-mesh" aria-hidden="true"></div>
    <div class="secret-particles" aria-hidden="true"><span>✧</span><span>+</span><span>✳</span><span>✦</span><span>×</span><span>✳</span><span>+</span><span>✧</span></div>
    <button class="secret-close" type="button" aria-label="Закрыть" onclick="closeEasterEgg()">×</button>
    <div class="secret-content">
      <div class="secret-eyebrow"><span class="secret-blink"></span> CODE DETECTED <span class="secret-blink"></span></div>
      <div class="secret-number" aria-label="67"><span class="digit digit-six">6</span><span class="digit digit-seven">7</span></div>
      <div class="secret-slogan"><span>SIX</span><span>SEVEN!</span></div>
      <div class="secret-caption">THE LEGENDARY NUMBER</div>
    </div>
    <div class="secret-actions">
      <button type="button" class="replay-button" onclick="replaySixSeven()">↻ &nbsp; ЕЩЁ РАЗ</button>
      <button type="button" class="back-button" onclick="closeEasterEgg()">← &nbsp; К КАЛЬКУЛЯТОРУ</button>
    </div>
  </section>
  <audio id="sixSevenAudio" src="six-seven.mp3" preload="auto"></audio>
</body>
</html>
